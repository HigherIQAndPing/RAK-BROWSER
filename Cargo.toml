[package]
name = "rak"
version = "0.6.0"
description = "RAK - Render Accelerated Kinetic"
edition = "2021"

[dependencies]
tao = "0.33"
wry = "0.51"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Verhindert, dass Cargo in übergeordneten Ordnern nach einer fremden Cargo.toml sucht
[workspace]

# Kleinere, schnellere .exe
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
