[package]
name = "rak"
version = "0.15.0"
description = "RAK - Render Accelerated Kinetic"
edition = "2021"

[dependencies]
tao = "0.33"
wry = "0.51"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2.1"
url = "2"
dirs = "6"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
zeroize = "1"
ed25519-dalek = "2"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Verhindert, dass Cargo in übergeordneten Ordnern nach einer fremden Cargo.toml sucht
[workspace]

# Kleinere, schnellere .exe
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
