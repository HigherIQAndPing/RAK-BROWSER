name: Windows portable

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Windows x64 - Tests und portable EXE
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node fuer Oberflaechen-Tests bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tab-Islands-Oberflaeche testen
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'rak-ui-tools'
          npm install --prefix "$tools" --no-audit --no-fund --no-save jsdom@26.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NODE_PATH = Join-Path $tools 'node_modules'
          node --test tests/ui.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust MSVC x64 installieren (nur CI)
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tests mit gesperrten Abhaengigkeiten
        shell: pwsh
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Optimierte Windows-EXE bauen
        shell: pwsh
        run: |
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Eigenstaendige EXE pruefen und ZIP packen
        shell: pwsh
        run: ./packaging/package-windows.ps1

      # GitHub erzeugt beim Download dieses Artefakts RAK-windows-x64.zip.
      # Die Dateien liegen direkt im ZIP, nicht in einem weiteren ZIP.
      - name: RAK-windows-x64.zip als Build-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: RAK-windows-x64
          path: dist/RAK-windows-x64/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Tag als privates Repository-Release veroeffentlichen
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Gepruefte portable Dateien herunterladen
        uses: actions/download-artifact@v4
        with:
          name: RAK-windows-x64
          path: dist/RAK-windows-x64

      # Signierte Update-Dateien fuer die automatische Aktualisierung in RAK:
      # RAK.exe + update.json (Version, SHA-256) + update.json.sig (Ed25519).
      - name: Repository fuer das Signier-Werkzeug auschecken
        uses: actions/checkout@v4
        with:
          path: src-repo

      - name: Version in Cargo.toml muss zum Tag passen
        shell: pwsh
        working-directory: src-repo
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne $env:RELEASE_TAG) { throw "Cargo.toml ($v) passt nicht zum Tag $env:RELEASE_TAG - sonst wuerde RAK sich endlos neu aktualisieren." }

      - name: Update-Dateien signieren
        shell: pwsh
        working-directory: src-repo
        env:
          RAK_SIGNING_KEY: ${{ secrets.RAK_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:RAK_SIGNING_KEY) { throw 'Secret RAK_SIGNING_KEY fehlt (Settings > Secrets and variables > Actions).' }
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          cargo build --locked --release --bin rak-sign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path ../dist/update -Force | Out-Null
          Copy-Item ../dist/RAK-windows-x64/RAK.exe ../dist/update/RAK.exe
          ./target/release/rak-sign.exe ../dist/update/RAK.exe "$env:RELEASE_TAG" ../dist/update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release-ZIP und deutsche Hinweise erstellen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path 'dist/RAK-windows-x64/*' -DestinationPath 'dist/RAK-windows-x64.zip' -Force
          $changes = @{
            'v0.3.0' = @'
          ### Diese Version
          * Neue interne Startseite mit RAK-Logo, Suche und Schnellzugriffen.
          * Der letzte geschlossene Tab beendet den Browser nicht mehr, sondern oeffnet die Startseite.
          * Tab-Islands und Windows-portable Release eingefuehrt.
          '@
            'v0.3.1' = @'
          ### Diese Version
          * Native Titelleiste auf den kurzen Namen **RAK** reduziert.
          * Startseite von der starken Verlauf-/Glasoptik auf ein ruhigeres Browser-Design umgestellt.
          '@
            'v0.4.0' = @'
          ### Diese Version
          * Eigene RAK-Titelleiste mit Ziehbereich sowie Minimieren, Maximieren und Schliessen.
          * Responsive Startseite und dokumentierte Strg-T/Strg-W-Kuerzel.
          '@
            'v0.5.0' = @'
          ### Diese Version
          * F11-Vollbildmodus ergaenzt.
          * Layout und Startseite reagieren beim Maximieren besser auf die Fenstergrösse.
          * Tastatursteuerung wurde in Rust zentralisiert.
          '@
            'v0.6.0' = @'
          ### Diese Version
          * Shortcuts werden auch in fokussierten WebView2-Seiten abgefangen.
          * Strg-T, Strg-W, Strg-Umschalt-N und F11 werden ueber eine begrenzte IPC-Whitelist an Rust geleitet.
          '@
            'v0.7.0' = @'
          ### Diese Version
          * Echter Vollbildmodus ohne obere Browserleisten.
          * Vollflaechiger Homescreen mit responsivem Raster.
          * Import kompatibler Erweiterungen aus Chrome, Edge, Brave, Opera und Firefox-Profilen.
          '@
            'v0.8.0' = @'
          ### Diese Version
          * F11 blendet jetzt auch Tab-, Adress-, Werkzeug- und Lesezeichenleiste aus.
          * Homescreen-Karten skalieren proportional in Breite und Hoehe und bleiben scrollbar-frei.
          '@
            'v0.9.0' = @'
          ### Diese Version
          * RAK-Logo und Startseite im Homescreen zentriert und farbiger gestaltet.
          * Platzhalter in der Suchleiste vergrössert und responsiv gemacht.
          * Websuche-, YouTube-, GitHub- und Spotify-Icons mittig, groesser und skalierend.
          '@
            'v0.9.1' = @'
          ### Diese Version
          * TikTok als eigene Seitenleisten-App mit passendem Icon und direktem Panel-Link ergänzt.
          * ChatGPT als KI-Assistent in die Seitenleiste aufgenommen.
          * Beide Apps sind standardmäßig aktiv und können über „Seitenleiste anpassen“ ein- oder ausgeblendet werden.
          '@
            'v0.9.2' = @'
          ### Diese Version
          * Startseite auf das ruhigere, funktionale Layout von Version 0.6 zurückgesetzt.
          * Neuer Bereich „Zuletzt geöffnet“ mit bis zu acht Einträgen aus dem lokalen Verlauf.
          * Verlaufseinträge können direkt von der Startseite erneut geöffnet werden.
          '@
            'v0.9.7' = @'
          ### Diese Version
          * Startseite: Suchfeld bleibt auch bei Fokus gleichmaessig gefuellt; Fokus wird am Suchrahmen angezeigt.
          * F11: Layout wird nach dem nativen Vollbildwechsel erneut an die endgueltige Fenstergeometrie angepasst.
          '@
            'v0.9.6' = @'
          ### Diese Version
          * Sicherheit: Updates werden in Release-Builds ausschliesslich ueber HTTPS (auch bei Weiterleitungen) geladen.
          * Release-Pruefung: Tag und Version in Cargo.toml muessen uebereinstimmen.
          '@
            'v0.9.5' = @'
          ### Diese Version
          * Sitzungswiederherstellung: Die beim Beenden offenen Tabs sind beim naechsten Start wieder da (private Tabs werden nie gespeichert).
          '@
            'v0.9.4' = @'
          ### Diese Version
          * Automatische, signierte Updates: RAK prueft im Hintergrund auf neue Versionen und zeigt "Update - Neustart".
          * Updates werden nur mit gueltiger Ed25519-Signatur, passender SHA-256-Pruefsumme und hoeherer Versionsnummer installiert.
          '@
            'v0.9.3' = @'
          ### Diese Version
          * „Zuletzt geöffnet“ wird fest in zwei Spalten und bis zu vier Zeilen dargestellt.
          * Verlaufskarten, Icons und Texte wurden für bessere Lesbarkeit vergrößert.
          '@
            'v0.9.8' = @'
          ### Diese Version
          * Startseite bleibt dauerhaft als kleines Haus-Symbol links in der Tab-Leiste geöffnet.
          * Mittelklick auf Links öffnet sie in einem neuen Tab – auch auf der Startseite.
          * RAK-Kontextmenü für Links und Bilder mit Kopieren- und „In neuem Tab öffnen“-Aktionen.
          '@
            'v0.9.9' = @'
          ### Diese Version
          * Verschlüsselter SQLite-Passworttresor mit AES-256-GCM und eigener Nonce pro Eintrag.
          * Optionales Argon2id-Master-Passwort mit Auto-Lock nach zehn Minuten.
          * browser://passwords und origin-geprüfte Autofill-Bridge für passende WebView-Origins.
          '@
          }
          $featureNotes = $changes[$env:RELEASE_TAG]
          if (-not $featureNotes) { $featureNotes = "### Diese Version`n* Technische Verbesserungen und Fehlerbehebungen.`n" }
          @"
          $featureNotes

          ## RAK fuer Windows x64 - ohne Rust starten

          1. Unter **Assets** die Datei **RAK-windows-x64.zip** herunterladen.
          2. Das ZIP vollstaendig entpacken, nicht direkt aus dem ZIP starten.
          3. **RAK.exe** oder **start.bat** doppelklicken.

          Rust, Cargo und Visual Studio werden zum Starten nicht benoetigt.
          Die MSVC-C-Laufzeit ist statisch eingebunden; ein Visual C++ Redistributable ist nicht erforderlich.

          **Voraussetzung:** Microsoft Edge WebView2 Runtime (Evergreen). Sie ist nicht im ZIP enthalten.
          Unter Windows 11 ist sie normalerweise vorhanden, ebenso auf vielen Windows-10-Systemen.
          Falls sie fehlt, optional **setup-webview2.bat** oeffnen oder die offizielle Microsoft-Seite besuchen:
          https://developer.microsoft.com/en-us/microsoft-edge/webview2/#download-section
          Beim Start wird weder Rust noch WebView2 automatisch heruntergeladen oder installiert.

          Tab-Inseln buendeln zusammengehoerige Tabs: automatisch fuer verwandte neue Links,
          manuell per Strg-/Umschalt-Auswahl, mit farbigen einklappbaren Griffen,
          Namen/Farben im Kontextmenue sowie Drag-and-drop. Private und normale Tabs bleiben getrennt.
          Weitere Bedienhinweise und Datenschutzgrenzen stehen in README.txt.

          Dieses Release bleibt aufgrund der Sichtbarkeit des Repositorys privat.
          Fuer den Download ist eine GitHub-Anmeldung mit Zugriff auf das Repository erforderlich.
          "@ | Set-Content -LiteralPath 'dist/release-notes.md' -Encoding utf8

      - name: Release mit GITHUB_TOKEN erstellen und ZIP hochladen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Benutzerkontrollierte Ref-Namen werden nur als zitierte Umgebungswerte genutzt.
          # Releases erben die Repository-Sichtbarkeit; es gibt kein gh --private-Flag.
          gh release view "$env:RELEASE_TAG" --repo "$env:GH_REPO" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit "$env:RELEASE_TAG" --repo "$env:GH_REPO" --title "RAK $env:RELEASE_TAG - Windows x64" --notes-file 'dist/release-notes.md'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create "$env:RELEASE_TAG" --repo "$env:GH_REPO" --verify-tag --title "RAK $env:RELEASE_TAG - Windows x64" --notes-file 'dist/release-notes.md'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload "$env:RELEASE_TAG" 'dist/RAK-windows-x64.zip' 'dist/update/RAK.exe' 'dist/update/update.json' 'dist/update/update.json.sig' --repo "$env:GH_REPO" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
