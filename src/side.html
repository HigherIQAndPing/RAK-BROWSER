<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#0d0d12; --panel:#16161d; --accent:#19d3ff; --green:#1db954; --text:#e8e8f0; --red:#ff4d6d; }
  * { box-sizing:border-box; margin:0; padding:0; user-select:none; font-family:"Segoe UI",system-ui,sans-serif; }
  body { background:var(--bg); height:100vh; overflow:hidden; border-right:1px solid #000;
         display:flex; flex-direction:column; align-items:center; padding:10px 0; gap:10px; }
  #apps, .tools { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .item { position:relative; width:36px; height:36px; border:none; border-radius:50%; cursor:pointer; transition:all .15s;
          display:flex; align-items:center; justify-content:center; flex:none; font-size:18px; }
  .item svg { display:block; }
  .item.sp { background:var(--panel); color:var(--green); }
  .item.sp:hover, .item.sp.active { background:var(--green); color:#0d0d12; box-shadow:0 0 12px -2px var(--green); }
  .item.ig { background:linear-gradient(45deg,#f9a03c,#d62976 55%,#6b4fd8); color:#fff; }
  .item.ig:hover, .item.ig.active { box-shadow:0 0 12px -1px #d62976; filter:brightness(1.1); }
  .item.xx { background:#000; color:#fff; border:1px solid #3a3a46; }
  .item.xx:hover, .item.xx.active { background:#fff; color:#000; box-shadow:0 0 12px -2px #fff; }
  .item.tt { background:#111; color:#fff; border:1px solid #36434a; }
  .item.tt:hover, .item.tt.active { background:linear-gradient(135deg,#25f4ee,#fe2c55); color:#fff; box-shadow:0 0 12px -2px #25f4ee; }
  .item.ai { background:linear-gradient(135deg,#263249,#4c6fff); color:#dff9ff; }
  .item.ai:hover, .item.ai.active { background:linear-gradient(135deg,#3b82f6,#8b5cf6); color:#fff; box-shadow:0 0 12px -2px #6f8cff; }
  .item.active::before { content:""; position:absolute; left:-8px; top:8px; width:3px; height:20px; border-radius:2px; background:var(--accent); }
  .item.dim { opacity:.38; filter:grayscale(.7); }
  .badge { position:absolute; top:-4px; right:-5px; width:17px; height:17px; border-radius:50%; font-size:12px; line-height:17px; text-align:center;
           font-weight:700; color:#fff; border:2px solid var(--bg); box-sizing:content-box; width:13px; height:13px; line-height:13px; }
  .badge.rm { background:var(--red); }
  .badge.add { background:var(--green); }
  .tools { display:none; padding-top:6px; border-top:1px solid #23232e; width:36px; gap:6px; }
  body.open:not(.edit) .tools { display:flex; }
  .mini { width:28px; height:28px; border:none; border-radius:8px; background:var(--panel); color:var(--text); font-size:16px; line-height:1; cursor:pointer; }
  .mini:hover { background:#2a2a38; color:var(--green); }
  #edit { margin-top:auto; width:30px; height:30px; border:none; border-radius:8px; background:transparent; color:#6b6b7b; cursor:pointer;
          display:flex; align-items:center; justify-content:center; }
  #edit:hover { background:var(--panel); color:var(--accent); }
  body.edit #edit { background:var(--accent); color:#0d0d12; }
</style>
</head>
<body>
  <div id="apps"></div>
  <div class="tools">
    <button class="mini" id="bigger" title="Panel größer">＋</button>
    <button class="mini" id="smaller" title="Panel kleiner">－</button>
  </div>
  <button id="edit" title="Seitenleiste anpassen"></button>
<script>
  const send = (m) => {
    try {
      if (window.ipc && window.ipc.postMessage) return window.ipc.postMessage(m);
      if (window.chrome && window.chrome.webview) return window.chrome.webview.postMessage(m);
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ipc)
        return window.webkit.messageHandlers.ipc.postMessage(m);
    } catch (e) { console.error("IPC-Fehler", e); }
  };

  const ICONS = {
    spotify:   { label: "Spotify",       cls: "sp", html: "♫" },
    instagram: { label: "Instagram",     cls: "ig", html: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.8" cy="7.2" r="1.1" fill="currentColor" stroke="none"/></svg>' },
    x:         { label: "X (Twitter)",   cls: "xx", html: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M5 4.5l14 15M19 4.5l-14 15"/></svg>' },
    tiktok:   { label: "TikTok",         cls: "tt", html: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M14 4v10.2a4.2 4.2 0 1 1-3.1-4.1"/><path d="M14 4c.7 2.7 2.3 4.2 5 4.5"/></svg>' },
    chatgpt:   { label: "ChatGPT",        cls: "ai", html: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.5a4.2 4.2 0 0 1 4 2.9 4.2 4.2 0 0 1 3.7 5.9 4.2 4.2 0 0 1-3.7 6.1 4.2 4.2 0 0 1-7.2 1.1 4.2 4.2 0 0 1-3.7-5.9A4.2 4.2 0 0 1 8.8 7.5 4.2 4.2 0 0 1 12 3.5z"/><path d="M12 7v10M7.7 9.5l8.6 5M7.7 14.5l8.6-5"/></svg>' }
  };
  const PENCIL = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  const st = { apps: [], open: null, edit: false };
  const appsEl = document.getElementById("apps");
  const editBtn = document.getElementById("edit");

  function applyColors(colors) {
    if (!colors) return;
    const root = document.documentElement.style;
    root.setProperty('--bg', colors.sidebar || '#0d0d12');
    root.setProperty('--panel', colors.tabs || '#16161d');
    root.setProperty('--accent', colors.accent || '#19d3ff');
    root.setProperty('--text', colors.text || '#e8e8f0');
  }

  function render() {
    appsEl.innerHTML = "";
    document.body.classList.toggle("edit", st.edit);
    document.body.classList.toggle("open", !!st.open);
    editBtn.innerHTML = st.edit ? CHECK : PENCIL;
    editBtn.title = st.edit ? "Fertig" : "Seitenleiste anpassen (Apps entfernen / hinzufügen)";
    for (const a of st.apps) {
      if (!a.enabled && !st.edit) continue;
      const meta = ICONS[a.id] || { label: a.id, cls: "sp", html: "?" };
      const b = document.createElement("button");
      b.className = "item " + meta.cls + (st.open === a.id ? " active" : "") + (a.enabled ? "" : " dim");
      b.innerHTML = meta.html;
      b.title = st.edit ? (a.enabled ? meta.label + " – × zum Entfernen" : meta.label + " – + zum Hinzufügen") : meta.label;
      if (st.edit) {
        const badge = document.createElement("span");
        badge.className = "badge " + (a.enabled ? "rm" : "add");
        badge.textContent = a.enabled ? "×" : "+";
        b.appendChild(badge);
        b.onclick = () => send((a.enabled ? "sbrm:" : "sbadd:") + a.id);
      } else {
        b.onclick = () => send("app:" + a.id);
      }
      appsEl.appendChild(b);
    }
  }

  window.side = {
    setState(s) { st.apps = s.apps; st.open = s.open; applyColors(s.colors); render(); }
  };
  editBtn.onclick = () => { st.edit = !st.edit; render(); };
  document.getElementById("bigger").onclick = () => send("sp+");
  document.getElementById("smaller").onclick = () => send("sp-");
  render();
  send("ready");
</script>
</body>
</html>
