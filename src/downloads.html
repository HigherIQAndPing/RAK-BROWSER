<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Downloads</title><style>
:root{color-scheme:dark;font-family:Segoe UI,system-ui,sans-serif;background:#0d1015;color:#edf3f7}*{box-sizing:border-box}body{margin:0;padding:34px;max-width:1000px;margin-inline:auto}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #2e3944;padding-bottom:18px}.eyebrow{color:#6de0ff;text-transform:uppercase;letter-spacing:.14em;font-size:11px}.head h1{margin:6px 0 0;font-size:30px}.sub{color:#9eabb7;margin:8px 0 0}.tools{display:flex;gap:8px}.btn{border:1px solid #3a4b58;background:#18232c;color:#eaf4f7;border-radius:8px;padding:8px 12px;cursor:pointer}.btn:hover{background:#223440}.list{display:grid;gap:10px;margin-top:22px}.item{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;background:#151c23;border:1px solid #293641;border-radius:12px;padding:14px}.icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#123b4a;color:#76e3ff;font-size:20px}.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:12px;color:#9eabb7;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status{font-size:12px;color:#72e7aa}.status.bad{color:#ff8e9d}.status.busy{color:#ffd478}.empty{margin-top:24px;border:1px dashed #3a4b58;border-radius:12px;padding:35px;text-align:center;color:#9eabb7}
</style></head><body><div class="head"><div><div class="eyebrow">RAK Browser</div><h1>Downloads</h1><p class="sub">Lokale Download-Historie und Speicherorte</p></div><div class="tools"><button class="btn" id="refresh">Aktualisieren</button></div></div><div id="list" class="list"></div><div id="empty" class="empty" hidden>Noch keine Downloads.</div><script>
const send=(m)=>{try{window.ipc&&window.ipc.postMessage(m)}catch(_){}};const list=document.getElementById('list'),empty=document.getElementById('empty');
function esc(s){return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function setData(items){items=Array.isArray(items)?items:[];list.replaceChildren();empty.hidden=items.length>0;items.forEach(d=>{const row=document.createElement('div');row.className='item';const cls=d.success?'':' '+(d.status==='Lädt …'?'busy':'bad');row.innerHTML='<div class="icon">⇩</div><div><div class="name" title="'+esc(d.name)+'">'+esc(d.name)+'</div><div class="meta" title="'+esc(d.path)+'">'+esc(d.path||d.url)+'</div></div><div><div class="status'+cls+'">'+esc(d.status)+'</div><button class="btn open" type="button">Öffnen</button></div>';row.querySelector('.open').onclick=()=>send(JSON.stringify({t:'download_open',path:d.path}));list.appendChild(row)})}
document.getElementById('refresh').onclick=()=>send(JSON.stringify({t:'download_ready'}));window.setData=setData;send(JSON.stringify({t:'download_ready'}));
</script></body></html>
