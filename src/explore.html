<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAK Explore</title>
<style>
:root{--bg:#080b11;--panel:#111823;--line:#263445;--accent:#59d5ee;--text:#ecf5fb;--dim:#91a3b4}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 50% 38%,#102b42 0,#080b11 54%);color:var(--text);font:13px "Segoe UI",system-ui,sans-serif}.shell{height:100%;display:grid;grid-template-rows:auto 1fr auto;min-height:0}.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px;position:relative;z-index:2}.brand{display:flex;gap:11px;align-items:center}.mark{display:grid;place-items:center;width:32px;height:32px;border:1px solid #3c8ba0;border-radius:10px;color:var(--accent);font-weight:900;font-style:italic;letter-spacing:2px;background:linear-gradient(145deg,#163748,#172137)}h1{font-size:17px;margin:0}.sub{color:var(--dim);font-size:11px;margin-top:2px}.hint{color:var(--dim);font-size:11px}.stage{position:relative;min-height:0}.globe{position:absolute;inset:0}.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);pointer-events:none}.hud{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 18px 16px;background:linear-gradient(180deg,transparent,#080b11 22%);position:relative;z-index:2}.coords{min-width:0}.coords strong{font-size:14px}.coords small{display:block;color:var(--dim);margin-top:3px}.actions{display:flex;gap:8px;flex-shrink:0}.btn{border:1px solid var(--line);background:#131c28;color:var(--text);border-radius:8px;padding:9px 12px;cursor:pointer;font:inherit}.btn:hover{border-color:var(--accent);color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#071217;font-weight:700}.attribution{position:absolute;right:10px;bottom:8px;color:#91a3b4aa;font-size:9px;z-index:3;pointer-events:none}
</style></head><body><main class="shell"><header class="top"><div class="brand"><span class="mark">RAK</span><div><h1>Explore</h1><div class="sub">Ein zufälliger Ort auf festem Land</div></div></div><div class="hint">Globus ziehen · Mausrad zoomen</div></header><section class="stage"><div id="globe" class="globe"></div><div id="loading" class="loading">Landmassen werden geladen …</div><div class="attribution">Landdaten: Natural Earth · Darstellung: Globe.gl</div></section><footer class="hud"><div class="coords"><strong id="place">Bereit für eine Entdeckung</strong><small id="coordinates">Beim Öffnen wird ein Landpunkt ausgewählt.</small></div><div class="actions"><button class="btn" id="next">Nächster Zufallsort</button><button class="btn primary" id="search">Im Browser suchen</button></div></footer></main>
<script src="https://unpkg.com/globe.gl@2.45.0/dist/globe.gl.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script><script>
const LAND_DATA=__LAND_DATA__;
const post=o=>{try{const m=JSON.stringify(o);if(window.ipc?.postMessage)return window.ipc.postMessage(m);if(window.chrome?.webview)return window.chrome.webview.postMessage(m)}catch(e){}};
let globe,land=[],current=null;
const $=id=>document.getElementById(id);
function inside(p,feature){try{return turf.booleanPointInPolygon(turf.point([p.lng,p.lat]),feature)}catch(e){return false}}
function randomLand(){for(let i=0;i<12000;i++){const p={lat:-78+Math.random()*156,lng:-180+Math.random()*360};if(land.some(f=>inside(p,f)))return p}return {lat:51.16,lng:10.45}}
function setPoint(p,animate=true){current=p;if(!globe)return;globe.pointsData([p]).pointLat('lat').pointLng('lng').pointColor(()=>'#ff6b79').pointAltitude(.085).pointRadius(.72).pointResolution(20).pointsMerge(false);globe.pointOfView({lat:p.lat,lng:p.lng,altitude:.36},animate?1700:0);$('coordinates').textContent=`Breite ${p.lat.toFixed(4)}° · Länge ${p.lng.toFixed(4)}° · Landpunkt`;$('place').textContent='Zufälliger Landpunkt'}
async function load(){try{land=LAND_DATA.features||[];globe=Globe()(document.getElementById('globe')).backgroundColor('rgba(0,0,0,0)').showAtmosphere(true).atmosphereColor('#58c9ee').atmosphereAltitude(.18).globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg').bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png').pointLabel(p=>`<b>${p.lat.toFixed(4)}°, ${p.lng.toFixed(4)}°</b>`);window.addEventListener('resize',()=>globe.width(document.getElementById('globe').clientWidth).height(document.getElementById('globe').clientHeight));$('loading').style.display='none';setPoint(randomLand(),false)}catch(e){$('loading').textContent='Globus konnte nicht geladen werden.';console.error(e)}}
$('next').onclick=()=>setPoint(randomLand(),true);$('search').onclick=()=>{if(!current)return;post({t:'explore_search',lat:current.lat,lng:current.lng})};load();
</script></body></html>
