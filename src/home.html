<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>RAK Startseite</title>
<style>
:root{--bg:#111318;--panel:#181b21;--panel2:#20242c;--line:#2a3039;--accent:#55c7df;--text:#e7eaf0;--dim:#9098a5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg)}body{overflow:auto}
.wrap{position:relative;width:min(1120px,calc(100% - 72px));margin:0 auto;padding:68px 0 90px}.wrap:before{content:"";position:absolute;inset:22px -34px auto;height:180px;border-top:1px solid #252d34;border-bottom:1px solid #1d252b;background:linear-gradient(90deg,transparent,#182a31 48%,transparent);opacity:.72;pointer-events:none}
.header{position:relative;display:flex;align-items:center;gap:18px;padding:0 0 25px;border-bottom:1px solid var(--line);margin-bottom:27px}.logo{display:grid;place-items:center;width:58px;height:58px;border:1px solid #3b7f91;border-radius:12px;color:var(--accent);font-size:18px;font-weight:900;font-style:italic;letter-spacing:3px;background:#17242a}.brand{color:var(--dim);font-size:12px;letter-spacing:.4px}h1{margin:3px 0 0;font-size:clamp(27px,3vw,36px);font-weight:650;letter-spacing:-.4px}
.search{display:flex;gap:8px;align-items:center;padding:8px;margin-bottom:30px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.search input{flex:1;min-width:0;height:40px;border:0;outline:0;border-radius:7px;background:transparent;color:var(--text);padding:0 11px;font-size:14px;user-select:text}.search input:focus{background:transparent}.search:focus-within{border-color:var(--accent)}.search button,.tile,.action,.recent-item{border:0;cursor:pointer;color:var(--text)}.search button{height:40px;padding:0 17px;border-radius:7px;color:#0c171a;background:var(--accent);font-weight:700}.search button:hover{background:#79d7e8}
.section-title{margin:0 2px 10px;color:var(--dim);font-size:11px;font-weight:650;letter-spacing:1px;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{min-height:142px;padding:18px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.tile:hover{border-color:#4c7480;background:var(--panel2)}.tile .icon{display:grid;place-items:center;width:30px;height:30px;margin-bottom:29px;border-radius:7px;color:var(--accent);background:#202d33;font-size:15px}.tile strong{display:block;font-size:13px;font-weight:650;margin-bottom:4px}.tile span{display:block;color:var(--dim);font-size:11px;line-height:1.35}
.recent{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(62px,1fr));gap:10px}.recent-item{display:flex;align-items:center;gap:13px;min-width:0;min-height:62px;padding:14px 16px;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.recent-item:hover{border-color:#4c7480;background:var(--panel2)}.recent-dot{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:8px;color:var(--accent);background:#202d33;font-size:15px}.recent-copy{min-width:0}.recent-title,.recent-url{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.recent-title{font-size:14px;font-weight:650}.recent-url{margin-top:4px;color:var(--dim);font-size:11px}.empty{grid-column:1/-1;padding:16px 2px;color:var(--dim);font-size:12px}
.bottom{display:flex;gap:8px;margin-top:20px}.action{padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--dim);font-size:12px}.action:hover{color:var(--text);border-color:#4c7480;background:var(--panel)}.status{margin-top:31px;color:#68717e;font-size:11px}
@media(max-width:650px){.wrap{width:calc(100% - 32px);padding-top:38px}.grid{grid-template-columns:repeat(2,1fr)}.recent{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(58px,1fr))}}
@media(max-width:480px){.wrap{width:calc(100% - 28px);padding-top:32px}.grid{grid-template-columns:1fr 1fr;gap:8px}.recent{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(54px,1fr));gap:8px}.tile{min-height:120px;padding:13px}.tile .icon{margin-bottom:20px}h1{font-size:22px}.recent-item{gap:8px;padding:10px}.recent-dot{width:28px;height:28px;font-size:13px}.recent-title{font-size:11px}.recent-url{font-size:9px}}
</style></head>
<body><main class="wrap">
<header class="header"><div class="logo" aria-label="RAK Logo">RAK</div><div><div class="brand">Render · Accelerated · Kinetic</div><h1>Startseite</h1></div></header>
<form class="search" id="search"><input id="query" aria-label="Suchen oder Adresse eingeben" placeholder="Suchen oder Adresse eingeben" autocomplete="off"><button type="submit">Suchen</button></form>
<div class="section-title">Schnellzugriff</div><section class="grid"><button class="tile" data-url="https://www.google.com"><div class="icon">⌕</div><strong>Websuche</strong><span>Eine Suche starten</span></button><button class="tile" data-url="https://www.youtube.com"><div class="icon">▶</div><strong>YouTube</strong><span>Videos öffnen</span></button><button class="tile" data-url="https://github.com"><div class="icon">◈</div><strong>GitHub</strong><span>Projekte ansehen</span></button><button class="tile" data-url="https://open.spotify.com"><div class="icon">♫</div><strong>Spotify</strong><span>Musik öffnen</span></button></section>
<div class="section-title" style="margin-top:30px">Zuletzt geöffnet</div><section class="recent" id="recent" aria-live="polite"></section>
<div class="bottom"><button class="action" data-command="new">＋ Neuer Tab</button><button class="action" data-command="newp">Privater Tab</button><button class="action" data-command="settings">Einstellungen</button></div><div class="status" id="status">RAK · Tab Islands aktiv · F11 Vollbild · Deine Daten bleiben auf deinem Gerät</div>
</main><script>
const send=o=>{try{const m=JSON.stringify(o);if(window.ipc?.postMessage)return window.ipc.postMessage(m);if(window.chrome?.webview)return window.chrome.webview.postMessage(m);if(window.webkit?.messageHandlers?.ipc)return window.webkit.messageHandlers.ipc.postMessage(m)}catch(e){}};
const open=url=>send({t:'home_open',url});document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>open(b.dataset.url));document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>send({t:'home_command',command:b.dataset.command}));document.getElementById('search').onsubmit=e=>{e.preventDefault();const q=document.getElementById('query').value.trim();if(q)open(q)};
window.setData=d=>{const root=document.getElementById('recent');root.replaceChildren();const items=Array.isArray(d?.recent)?d.recent:[];if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Noch keine besuchten Seiten.';root.appendChild(empty)}else items.forEach(x=>{const b=document.createElement('button');b.className='recent-item';b.title=x.url||'';const dot=document.createElement('span');dot.className='recent-dot';dot.textContent='↗';const copy=document.createElement('span');copy.className='recent-copy';const title=document.createElement('span');title.className='recent-title';title.textContent=x.title||x.url||'Unbenannte Seite';const url=document.createElement('span');url.className='recent-url';url.textContent=x.url||'';copy.append(title,url);b.append(dot,copy);b.onclick=()=>open(x.url);root.appendChild(b)});if(d?.version)document.getElementById('status').textContent='RAK '+d.version+' · Tab Islands aktiv · F11 Vollbild · Deine Daten bleiben auf deinem Gerät'};
document.getElementById('query').focus();
</script></body></html>
