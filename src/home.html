<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>RAK Startseite</title>
<style>
:root{--bg:#111418;--panel:#191e24;--panel2:#222a32;--line:#303943;--accent:#58c9df;--text:#e7edf0;--dim:#8d99a5}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg)}
.home{height:100vh;min-height:360px;display:grid;grid-template-rows:auto 1fr auto;gap:clamp(18px,3vh,34px);padding:clamp(22px,5vh,64px) clamp(22px,5vw,84px) clamp(18px,4vh,46px);}
.head{display:flex;align-items:center;gap:18px;min-height:76px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.logo{display:grid;place-items:center;width:58px;height:58px;border:1px solid #3c8798;border-radius:13px;color:var(--accent);background:#17252b;font-size:18px;font-weight:900;font-style:italic;letter-spacing:3px;flex:none}.brand{font-size:12px;color:var(--dim);letter-spacing:.4px}.head h1{margin:3px 0 0;font-size:clamp(25px,3vw,38px);line-height:1.05;letter-spacing:-.6px}
.content{min-height:0;display:grid;grid-template-rows:auto auto 1fr;gap:clamp(14px,2.5vh,26px)}
.search{display:flex;gap:8px;width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.search input{min-width:0;flex:1;height:42px;border:0;outline:0;border-radius:7px;background:#14191e;color:var(--text);padding:0 13px;font-size:14px}.search input:focus{box-shadow:inset 0 0 0 1px #41616b}.search button{height:42px;padding:0 20px;border:0;border-radius:7px;color:#071216;background:var(--accent);font-weight:750;cursor:pointer}.search button:hover{background:#7cd9e8}
.label{color:var(--dim);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}.grid{min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tile{min-height:0;height:100%;padding:clamp(15px,2vw,24px);text-align:left;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);cursor:pointer}.tile:hover{border-color:#4e8995;background:var(--panel2)}.icon{display:grid;place-items:center;width:32px;height:32px;margin-bottom:clamp(18px,4vh,42px);border-radius:7px;color:var(--accent);background:#203038;font-size:15px}.tile strong{display:block;font-size:14px;margin-bottom:5px}.tile span{display:block;color:var(--dim);font-size:11px;line-height:1.4}.footer{display:flex;align-items:center;gap:9px;min-height:30px}.action{padding:9px 13px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--dim);font-size:12px;cursor:pointer}.action:hover{color:var(--text);border-color:#4e8995;background:var(--panel)}.status{margin-left:auto;color:#687580;font-size:11px}
@media(max-width:760px){.home{padding:24px 20px 20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.icon{margin-bottom:18px}.status{display:none}}
@media(max-width:430px){.home{gap:14px;padding:18px 14px 14px}.head{gap:11px;padding-bottom:14px}.logo{width:45px;height:45px;font-size:14px}.head h1{font-size:23px}.brand{font-size:10px}.grid{gap:7px}.tile{padding:12px}.tile strong{font-size:12px}.tile span{font-size:10px}.footer{gap:5px}.action{padding:8px 9px;font-size:11px}}
</style></head>
<body><main class="home">
<header class="head"><div class="logo">RAK</div><div><div class="brand">Render · Accelerated · Kinetic</div><h1>Startseite</h1></div></header>
<section class="content"><form class="search" id="search"><input id="query" aria-label="Suchen oder Adresse eingeben" placeholder="Suchen oder Adresse eingeben" autocomplete="off"><button type="submit">Suchen</button></form><div class="label">Schnellzugriff</div><div class="grid">
<button class="tile" data-url="https://www.google.com"><div class="icon">⌕</div><strong>Websuche</strong><span>Eine Suche starten</span></button><button class="tile" data-url="https://www.youtube.com"><div class="icon">▶</div><strong>YouTube</strong><span>Videos öffnen</span></button><button class="tile" data-url="https://github.com"><div class="icon">◈</div><strong>GitHub</strong><span>Projekte ansehen</span></button><button class="tile" data-url="https://open.spotify.com"><div class="icon">♫</div><strong>Spotify</strong><span>Musik öffnen</span></button>
</div></section>
<footer class="footer"><button class="action" data-command="new">＋ Neuer Tab</button><button class="action" data-command="newp">Privater Tab</button><button class="action" data-command="settings">Einstellungen</button><span class="status">RAK 0.7 · Tab Islands · F11 Vollbild</span></footer>
</main><script>
const send=o=>{try{const m=JSON.stringify(o);if(window.ipc?.postMessage)return window.ipc.postMessage(m);if(window.chrome?.webview)return window.chrome.webview.postMessage(m);if(window.webkit?.messageHandlers?.ipc)return window.webkit.messageHandlers.ipc.postMessage(m)}catch(e){}};const open=url=>send({t:'home_open',url});document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>open(b.dataset.url));document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>send({t:'home_command',command:b.dataset.command}));document.getElementById('search').onsubmit=e=>{e.preventDefault();const q=document.getElementById('query').value.trim();if(q)open(q)};document.getElementById('query').focus();
</script></body></html>
