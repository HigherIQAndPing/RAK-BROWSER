<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>RAK Startseite</title>
<style>
:root { --bg:#0d0d12; --panel:#16161d; --panel2:#1e1e28; --accent:#19d3ff; --text:#e8e8f0; --dim:#8a8a9a; }
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; font-family:"Segoe UI",system-ui,sans-serif; color:var(--text); background:radial-gradient(circle at 18% 8%, #173750 0, transparent 34%), radial-gradient(circle at 88% 16%, #2b1750 0, transparent 30%), var(--bg); }
body { overflow:auto; }
.wrap { width:min(980px, calc(100% - 48px)); margin:0 auto; padding:56px 0 72px; }
.hero { display:flex; align-items:center; gap:22px; margin-bottom:34px; }
.logo { width:92px; height:92px; display:grid; place-items:center; border-radius:27px; font-size:26px; font-weight:950; font-style:italic; letter-spacing:5px; color:#071017; background:linear-gradient(135deg,#19d3ff,#7a5cff 72%); box-shadow:0 0 42px rgba(25,211,255,.28), inset 0 0 0 1px rgba(255,255,255,.36); }
.kicker { color:var(--accent); font-size:11px; font-weight:800; letter-spacing:2.4px; text-transform:uppercase; margin-bottom:8px; }
h1 { margin:0; font-size:clamp(28px,5vw,48px); line-height:1.05; letter-spacing:-1.5px; background:linear-gradient(90deg,#fff,#9deeff 48%,#c3a8ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
.sub { margin:12px 0 0; color:var(--dim); font-size:14px; line-height:1.55; max-width:580px; }
.card { border:1px solid rgba(255,255,255,.09); background:rgba(22,22,29,.78); backdrop-filter:blur(18px); border-radius:22px; box-shadow:0 18px 60px rgba(0,0,0,.22); }
.search { display:flex; gap:10px; align-items:center; padding:10px; margin-bottom:26px; }
.search input { flex:1; min-width:0; height:44px; border:0; outline:0; border-radius:14px; background:var(--panel2); color:var(--text); padding:0 16px; font-size:14px; user-select:text; }
.search button,.tile,.action { border:0; cursor:pointer; color:var(--text); }
.search button { height:44px; padding:0 18px; border-radius:14px; color:#071017; background:var(--accent); font-weight:800; }
.section-title { display:flex; justify-content:space-between; align-items:center; margin:0 4px 12px; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:1.6px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:13px; }
.tile { text-align:left; min-height:126px; padding:18px; border-radius:18px; background:linear-gradient(145deg,rgba(30,30,40,.96),rgba(20,20,27,.84)); border:1px solid rgba(255,255,255,.08); transition:transform .16s, border-color .16s, box-shadow .16s; }
.tile:hover { transform:translateY(-3px); border-color:var(--accent); box-shadow:0 10px 28px rgba(25,211,255,.13); }
.tile .icon { font-size:25px; margin-bottom:18px; }
.tile strong { display:block; font-size:14px; margin-bottom:5px; }
.tile span { display:block; color:var(--dim); font-size:11px; line-height:1.4; }
.bottom { display:flex; flex-wrap:wrap; gap:10px; margin-top:25px; }
.action { padding:10px 14px; border-radius:12px; background:rgba(30,30,40,.8); border:1px solid rgba(255,255,255,.08); font-size:12px; }
.action:hover { color:var(--accent); border-color:var(--accent); }
.status { margin-top:28px; color:#6d7080; font-size:11px; }
@media(max-width:560px) { .wrap { width:calc(100% - 28px); padding-top:32px; } .hero { align-items:flex-start; gap:14px; } .logo { width:64px; height:64px; border-radius:19px; font-size:18px; } }
</style>
</head>
<body>
<main class="wrap">
  <section class="hero"><div class="logo" aria-label="RAK Logo">RAK</div><div><div class="kicker">Render · Accelerated · Kinetic</div><h1>Dein Browser.<br>Dein Flow.</h1><p class="sub">Schnell loslegen, Tabs als Inseln organisieren und genau dort weitermachen, wo deine Idee beginnt.</p></div></section>
  <form class="search card" id="search"><input id="query" aria-label="Suchen oder Adresse eingeben" placeholder="Suchen oder Adresse eingeben" autocomplete="off"><button type="submit">Los</button></form>
  <div class="section-title"><span>Schnellzugriff</span><span id="meta"></span></div>
  <section class="grid">
    <button class="tile" data-url="https://www.google.com"><div class="icon">⌕</div><strong>Websuche</strong><span>Direkt ins Netz starten</span></button>
    <button class="tile" data-url="https://www.youtube.com"><div class="icon">▶</div><strong>YouTube</strong><span>Videos und Inspiration</span></button>
    <button class="tile" data-url="https://github.com"><div class="icon">◈</div><strong>GitHub</strong><span>Code, Projekte und Releases</span></button>
    <button class="tile" data-url="https://open.spotify.com"><div class="icon">♫</div><strong>Spotify</strong><span>Musik neben deinem Flow</span></button>
  </section>
  <div class="bottom"><button class="action" data-command="new">＋ Neuer Tab</button><button class="action" data-command="newp">Privater Tab</button><button class="action" data-command="settings">⚙ Einstellungen</button></div>
  <div class="status">RAK 0.2 · Tab Islands aktiv · Daten bleiben auf deinem Gerät</div>
</main>
<script>
const send = o => { try { const m=JSON.stringify(o); if(window.ipc?.postMessage)return window.ipc.postMessage(m); if(window.chrome?.webview)return window.chrome.webview.postMessage(m); if(window.webkit?.messageHandlers?.ipc)return window.webkit.messageHandlers.ipc.postMessage(m); } catch(e){} };
const open = url => send({t:'home_open',url});
document.querySelectorAll('[data-url]').forEach(b => b.addEventListener('click', () => open(b.dataset.url)));
document.querySelectorAll('[data-command]').forEach(b => b.addEventListener('click', () => send({t:'home_command',command:b.dataset.command})));
document.getElementById('search').addEventListener('submit', e => { e.preventDefault(); const q=document.getElementById('query').value.trim(); if(q) open(q); });
document.getElementById('query').focus();
</script>
</body>
</html>
