<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>RAK Startseite</title>
<style>
:root{--bg:#101419;--surface:#171d23;--surface2:#202a32;--line:#34414b;--accent:#5bd0e5;--text:#edf3f5;--muted:#91a0ab}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif}
.home{width:100%;height:100%;min-height:340px;display:grid;grid-template-rows:minmax(70px,1fr) minmax(58px,.65fr) minmax(18px,.25fr) minmax(110px,2.6fr) auto;gap:clamp(10px,1.8vmin,28px);padding:clamp(18px,5vmin,82px) clamp(18px,5vmin,96px) clamp(16px,4vmin,60px);}
.hero{display:flex;align-items:center;gap:clamp(12px,2vmin,28px);border-bottom:1px solid var(--line);min-height:0}.logo{width:clamp(46px,7vmin,92px);height:clamp(46px,7vmin,92px);display:grid;place-items:center;flex:none;border:1px solid #438b9a;border-radius:clamp(10px,1.2vmin,17px);color:var(--accent);background:#17262d;font-size:clamp(14px,2.3vmin,30px);font-weight:950;font-style:italic;letter-spacing:.15em}.eyebrow{color:var(--muted);font-size:clamp(10px,1.3vmin,16px);letter-spacing:.08em}.hero h1{margin:.15em 0 0;font-size:clamp(25px,4.4vmin,62px);line-height:1;font-weight:650;letter-spacing:-.04em}
.search{display:flex;align-self:stretch;gap:clamp(6px,1vmin,12px);padding:clamp(5px,1vmin,10px);border:1px solid var(--line);border-radius:clamp(8px,1vmin,15px);background:var(--surface)}.search input{min-width:0;flex:1;border:0;outline:0;border-radius:clamp(5px,.7vmin,10px);background:#11171c;color:var(--text);padding:0 clamp(9px,1.4vmin,20px);font-size:clamp(12px,1.55vmin,20px)}.search input:focus{box-shadow:inset 0 0 0 1px #4c7580}.search button{width:clamp(76px,10vmin,150px);border:0;border-radius:clamp(5px,.7vmin,10px);background:var(--accent);color:#071317;font-size:clamp(11px,1.4vmin,18px);font-weight:750;cursor:pointer}.search button:hover{background:#86e0ed}
.label{align-self:end;color:var(--muted);font-size:clamp(9px,1.15vmin,15px);font-weight:750;letter-spacing:.14em;text-transform:uppercase}.cards{min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(7px,1.2vmin,20px)}.card{min-width:0;min-height:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(12px,2.4vmin,34px);border:1px solid var(--line);border-radius:clamp(8px,1.2vmin,17px);background:var(--surface);color:var(--text);text-align:left;cursor:pointer}.card:hover{background:var(--surface2);border-color:#5b9ca8}.icon{width:clamp(24px,4.2vmin,54px);height:clamp(24px,4.2vmin,54px);display:grid;place-items:center;border-radius:clamp(5px,.8vmin,11px);color:var(--accent);background:#20323a;font-size:clamp(12px,1.8vmin,25px)}.card-copy{margin-top:auto}.card strong{display:block;margin-bottom:.35em;font-size:clamp(12px,1.7vmin,23px);font-weight:700}.card span{display:block;color:var(--muted);font-size:clamp(10px,1.25vmin,17px);line-height:1.35}.footer{display:flex;align-items:center;gap:clamp(5px,1vmin,12px);min-height:0}.action{padding:clamp(7px,1.1vmin,14px) clamp(9px,1.5vmin,20px);border:1px solid var(--line);border-radius:clamp(5px,.7vmin,10px);background:transparent;color:var(--muted);font-size:clamp(10px,1.25vmin,17px);cursor:pointer}.action:hover{background:var(--surface2);color:var(--text);border-color:#5b9ca8}.status{margin-left:auto;color:#6f7e89;font-size:clamp(9px,1.1vmin,14px)}
@media(max-width:720px){.home{grid-template-rows:minmax(62px,1fr) minmax(54px,.6fr) minmax(18px,.2fr) minmax(130px,2fr) auto;padding:20px 18px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.status{display:none}}
@media(max-width:430px){.home{padding:14px;gap:9px}.hero{gap:10px}.cards{gap:6px}.card{padding:10px}.footer{gap:4px}.action{padding:7px 8px}}
</style></head>
<body><main class="home">
<header class="hero"><div class="logo">RAK</div><div><div class="eyebrow">Render · Accelerated · Kinetic</div><h1>Startseite</h1></div></header>
<form class="search" id="search"><input id="query" aria-label="Suchen oder Adresse eingeben" placeholder="Suchen oder Adresse eingeben" autocomplete="off"><button type="submit">Suchen</button></form>
<div class="label">Schnellzugriff</div>
<section class="cards"><button class="card" data-url="https://www.google.com"><div class="icon">⌕</div><div class="card-copy"><strong>Websuche</strong><span>Eine Suche starten</span></div></button><button class="card" data-url="https://www.youtube.com"><div class="icon">▶</div><div class="card-copy"><strong>YouTube</strong><span>Videos öffnen</span></div></button><button class="card" data-url="https://github.com"><div class="icon">◈</div><div class="card-copy"><strong>GitHub</strong><span>Projekte ansehen</span></div></button><button class="card" data-url="https://open.spotify.com"><div class="icon">♫</div><div class="card-copy"><strong>Spotify</strong><span>Musik öffnen</span></div></button></section>
<footer class="footer"><button class="action" data-command="new">＋ Neuer Tab</button><button class="action" data-command="newp">Privater Tab</button><button class="action" data-command="settings">Einstellungen</button><span class="status">RAK · Tab Islands · F11 Vollbild</span></footer>
</main><script>const send=o=>{try{const m=JSON.stringify(o);if(window.ipc?.postMessage)return window.ipc.postMessage(m);if(window.chrome?.webview)return window.chrome.webview.postMessage(m);if(window.webkit?.messageHandlers?.ipc)return window.webkit.messageHandlers.ipc.postMessage(m)}catch(e){}};const open=url=>send({t:'home_open',url});document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>open(b.dataset.url));document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>send({t:'home_command',command:b.dataset.command}));document.getElementById('search').onsubmit=e=>{e.preventDefault();const q=document.getElementById('query').value.trim();if(q)open(q)};document.getElementById('query').focus();</script></body></html>
