<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAK Startseite</title>
<style>
/* RAK-DESIGN:BEGIN – generiert aus design/rak-design.css (tools/apply-design.py), nicht von Hand ändern */
/* ====== RAK Design System · Tactical Cyberpunk Precision (Quelle: DESIGN.md aus Google Stitch) ======
   Nur natives CSS. Keine externen Schriften/Frameworks: Schriften werden über lokale Namen gesucht,
   sonst greifen die Windows-Systemschriften. Alle Komponenten benutzen die Variablen
   --bg --panel --panel2 --line --accent --on-accent --text --dim (+ --hover-line), damit das
   Light/Dark-Umschalten von RAK (rakApplyDesign) und die eigenen Farben weiter funktionieren. */
:root{
  color-scheme:dark;
  /* Palette (DESIGN.md → Colors) */
  --canvas:#0b0d11; --surface-1:#12151b; --surface-2:#1a1f28; --border:#252c38;
  --cyan:#00d2ff; --cyan-hover:#38bdf8; --sky:#0ea5e9;
  --text-hi:#f1f5f9; --text-mid:#94a3b8; --text-lo:#475569; --crimson:#f43f5e;
  /* Semantische Namen, die RAK schon kennt (werden vom Theme überschrieben) */
  --bg:var(--canvas); --panel:var(--surface-1); --panel2:var(--surface-2); --line:var(--border);
  --accent:var(--cyan); --on-accent:#0b0d11; --text:var(--text-hi); --dim:var(--text-mid);
  --hover-line:var(--sky); --danger:var(--crimson); --ok:#3ddc84; --warn:#ffd24a;
  /* Typografie */
  --font-display:"Space Grotesk","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --font-ui:"Geist","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  /* Form & Tiefe */
  --r-xs:2px; --r-sm:4px; --r-md:6px;
  --recess:color-mix(in srgb,var(--bg) 70%,var(--panel));
  --edge:inset 0 1px 0 color-mix(in srgb,var(--text) 5%,transparent);
  --glow:0 0 0 1px var(--accent),0 0 12px color-mix(in srgb,var(--accent) 18%,transparent);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body.rak-ds{background:var(--bg);color:var(--text);font:13px/18px var(--font-ui);-webkit-font-smoothing:antialiased;animation:rak-fade .22s var(--ease) both}
:where(.rak-ds) ::selection{background:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--text)}
:where(.rak-ds) h1,:where(.rak-ds) h2,:where(.rak-ds) h3{font-family:var(--font-display);letter-spacing:-.02em;margin:0}
:where(.rak-ds) code,:where(.rak-ds) kbd,:where(.rak-ds) .mono{font-family:var(--font-mono)}
:where(.rak-ds) :focus-visible{outline:0;box-shadow:var(--glow)}
:where(.rak-ds) button,:where(.rak-ds) select,:where(.rak-ds) input{font-family:inherit;font-size:inherit}
:where(.rak-ds) button{cursor:pointer}
:where(.rak-ds) button:disabled{opacity:.45;cursor:default}
/* Dünne, dunkle Scrollbalken */
.rak-ds{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
:where(.rak-ds) ::-webkit-scrollbar{width:8px;height:8px}
:where(.rak-ds) ::-webkit-scrollbar-thumb{background:var(--line);border-radius:var(--r-sm)}
:where(.rak-ds) ::-webkit-scrollbar-thumb:hover{background:var(--hover-line)}
/* Icons: inline SVG-Sprite, Größe über --s */
.ds-i{width:var(--s,16px);height:var(--s,16px);flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
/* Beschriftungen in Mono (Telemetrie-Look) */
.eyebrow,.tag{font-family:var(--font-mono);font-size:10px;line-height:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.eyebrow{color:var(--accent)}
/* Buttons */
.ds-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:32px;padding:6px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel2);color:var(--text);font-weight:500;box-shadow:var(--edge);transition:border-color .15s var(--ease),color .15s var(--ease),background .15s var(--ease),transform .08s}
.ds-btn:hover:not(:disabled){border-color:var(--accent);color:var(--text)}
.ds-btn:active:not(:disabled){transform:scale(.98)}
.ds-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.ds-btn.primary:hover:not(:disabled){background:var(--cyan-hover);border-color:var(--cyan-hover)}
.ds-btn.danger{color:var(--danger);background:transparent;border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.ds-btn.danger:hover:not(:disabled){background:var(--danger);border-color:var(--danger);color:#fff}
.ds-btn.mini{min-height:26px;padding:3px 10px;font-size:12px}
.ds-icon-btn{display:inline-grid;place-items:center;width:28px;height:28px;padding:0;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--dim);transition:all .15s var(--ease)}
.ds-icon-btn:hover:not(:disabled){background:var(--panel2);border-color:var(--line);color:var(--text)}
/* Eingabefelder */
.ds-field,:where(.rak-ds) input[type=text],:where(.rak-ds) input:not([type]),:where(.rak-ds) input[type=search],:where(.rak-ds) input[type=password]{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--recess);color:var(--text);outline:0;transition:border-color .15s,box-shadow .15s}
.ds-field:focus,:where(.rak-ds) input[type=text]:focus,:where(.rak-ds) input:not([type]):focus,:where(.rak-ds) input[type=search]:focus,:where(.rak-ds) input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 20%,transparent)}
:where(.rak-ds) input::placeholder{color:var(--text-lo)}
/* Auswahlfelder mit eingebettetem Pfeil (ohne Bild-URL) */
:where(.rak-ds) select{appearance:none;-webkit-appearance:none;height:32px;padding:0 30px 0 11px;border:1px solid var(--line);border-radius:var(--r-sm);background-color:var(--panel2);color:var(--text);outline:0;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-size:5px 5px,5px 5px;background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-repeat:no-repeat;transition:border-color .15s}
:where(.rak-ds) select:hover:not(:disabled),:where(.rak-ds) select:focus{border-color:var(--accent)}
:where(.rak-ds) select:disabled{opacity:.45;cursor:default}
:where(.rak-ds) select option{background:var(--panel);color:var(--text)}
/* Schalter (Toggle 36×18) und Checkboxen: gleiches <input type=checkbox>, nur anderes Aussehen */
:where(.rak-ds) input[type=checkbox]{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:36px;height:18px;margin:0;border:1px solid var(--line);border-radius:9px;background:var(--panel2);cursor:pointer;transition:background .14s var(--ease),border-color .14s var(--ease)}
:where(.rak-ds) input[type=checkbox]::after{content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:transform .14s var(--ease),background .14s var(--ease)}
:where(.rak-ds) input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
:where(.rak-ds) input[type=checkbox]:checked::after{transform:translateX(18px);background:#fff}
:where(.rak-ds) input[type=checkbox]:disabled{opacity:.45;cursor:default}
/* Module (Karten) */
.ds-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--edge)}
/* Tastenkürzel-Chips */
:where(.rak-ds) kbd{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:var(--r-xs);background:var(--panel2);color:var(--dim);font-size:10px;line-height:14px}
@keyframes rak-fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes rak-pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){body.rak-ds{animation:none}:where(.rak-ds) *{transition:none!important;animation:none!important}}

/* RAK-DESIGN:END */
:root{--rak-home-image:__RAK_HOME_BACKGROUND__;--header-glow:#12303a;--header-line:#252c38}
html,body{min-height:100%}
body{overflow:auto;background-image:var(--rak-home-image);background-size:cover;background-position:center;background-attachment:fixed}
.stage{position:relative;min-height:100vh;overflow:hidden}
.stage:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 48% at 50% 34%,color-mix(in srgb,var(--accent) 11%,transparent),transparent 70%)}
.watermark{position:absolute;left:50%;top:150px;width:520px;height:520px;margin-left:-260px;color:var(--accent);opacity:.05;pointer-events:none;--s:520px;stroke-width:.5}
.wrap{position:relative;width:min(960px,calc(100% - 72px));margin:0 auto;padding:72px 0 64px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:30px}
.logo{display:grid;place-items:center;width:48px;height:48px;margin-bottom:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel2);color:var(--accent);box-shadow:var(--edge)}
h1{font-size:clamp(30px,4vw,40px);line-height:1.1;font-weight:700}
.brand{margin-top:8px;color:var(--accent);font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
.search{display:flex;gap:8px;align-items:center;max-width:720px;margin:0 auto 34px;padding:6px 6px 6px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--recess);box-shadow:var(--edge);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent)}
.search:focus-within{box-shadow:0 0 8px color-mix(in srgb,var(--accent) 20%,transparent)}
.search .lead{color:var(--accent)}
.search input{flex:1;min-width:0;height:36px;border:0;outline:0;border-radius:var(--r-sm);background:transparent;color:var(--text);padding:0 4px;font-size:15px;user-select:text;box-shadow:none}
.search input:focus{background:transparent}
.search input:focus{box-shadow:none;border:0}
.search button{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border:0;border-radius:var(--r-sm);color:var(--on-accent);background:var(--accent);font-family:var(--font-mono);font-size:12px;font-weight:600;transition:background .15s,transform .08s}
.search button:hover{background:var(--cyan-hover)}.search button:active{transform:scale(.98)}
.section-title{display:flex;align-items:center;gap:8px;margin:0 2px 12px;color:var(--text);font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
.section-title .ds-i{color:var(--accent)}.section-title:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;counter-reset:dial}
.tile{position:relative;display:block;width:100%;min-height:128px;padding:14px;text-align:left;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);color:var(--text);box-shadow:var(--edge);cursor:pointer;counter-increment:dial;transition:border-color .15s var(--ease),background .15s var(--ease)}
.tile:before{content:counter(dial,decimal-leading-zero);position:absolute;top:14px;right:14px;color:var(--text-lo);font-family:var(--font-mono);font-size:11px}
.tile:hover{border-color:var(--hover-line);background:var(--panel2)}
.tile .icon{display:grid;place-items:center;width:28px;height:28px;margin-bottom:22px;border-radius:var(--r-sm);color:var(--accent);background:var(--panel2);border:1px solid var(--line)}
.tile strong{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
.tile span{display:block;color:var(--dim);font-size:12px;line-height:1.35}
.recent{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.recent-item{display:flex;align-items:center;gap:12px;min-width:0;min-height:56px;padding:10px 14px;text-align:left;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);color:var(--text);cursor:pointer;transition:border-color .15s var(--ease),background .15s var(--ease)}
.recent-item:hover{border-color:var(--hover-line);background:var(--panel2)}
/* Das Pfeil-Zeichen aus dem Skript wird ausgeblendet und als Linien-Pfeil gezeichnet */
.recent-dot{position:relative;display:block;flex:none;width:28px;height:28px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel2);color:var(--accent);font-size:0;line-height:0;overflow:hidden}
.recent-dot:before{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-top:1.7px solid currentColor;border-right:1.7px solid currentColor}
.recent-dot:after{content:"";position:absolute;left:13.5px;top:7.5px;width:1.7px;height:12px;background:currentColor;transform:rotate(45deg);transform-origin:center}
.recent-copy{min-width:0}.recent-title,.recent-url{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.recent-title{font-size:13px;font-weight:600}.recent-url{margin-top:2px;color:var(--dim);font-family:var(--font-mono);font-size:10.5px}
.empty{grid-column:1/-1;padding:14px 2px;color:var(--dim);font-size:12px}
.bottom{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.action{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel2);color:var(--text);font-size:12px;box-shadow:var(--edge);transition:border-color .15s,background .15s}
.action:hover{border-color:var(--accent)}
.status{display:flex;align-items:center;gap:8px;margin-top:30px;padding-top:14px;border-top:1px solid var(--line);color:var(--text-lo);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.03em}
.status:before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:rak-pulse 2.4s ease-in-out infinite}
@media(max-width:650px){.wrap{width:calc(100% - 32px);padding-top:44px}.recent{grid-template-columns:1fr}.watermark{display:none}}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr;gap:8px}.tile{min-height:112px}.status{font-size:9.5px}}
</style></head>

<main class="wrap">

<form class="search" id="search"><svg class="ds-i lead" style="--s:18px" aria-hidden="true"><use href="#i-search"/></svg><input id="query" aria-label="Suchen oder Adresse eingeben" placeholder="Suchen oder Adresse eingeben" autocomplete="off"><button type="submit">Suchen<svg class="ds-i" style="--s:15px" aria-hidden="true"><use href="#i-arrow-right"/></svg></button></form>
<div class="section-title"><svg class="ds-i" aria-hidden="true"><use href="#i-gauge"/></svg>Schnellzugriff</div><section class="grid"><button class="tile" data-url="https://www.google.com"><div class="icon"><svg class="ds-i" aria-hidden="true"><use href="#i-compass"/></svg></div><strong>Websuche</strong><span>Eine Suche starten</span></button><button class="tile" data-url="https://www.youtube.com"><div class="icon"><svg class="ds-i" aria-hidden="true"><use href="#i-play"/></svg></div><strong>YouTube</strong><span>Videos öffnen</span></button><button class="tile" data-url="https://github.com"><div class="icon"><svg class="ds-i" aria-hidden="true"><use href="#i-terminal"/></svg></div><strong>GitHub</strong><span>Projekte ansehen</span></button><button class="tile" data-url="https://open.spotify.com"><div class="icon"><svg class="ds-i" aria-hidden="true"><use href="#i-music"/></svg></div><strong>Spotify</strong><span>Musik öffnen</span></button></section>

</main></div><script>
const send=o=>{try{const m=JSON.stringify(o);if(window.ipc?.postMessage)return window.ipc.postMessage(m);if(window.chrome?.webview)return window.chrome.webview.postMessage(m);if(window.webkit?.messageHandlers?.ipc)return window.webkit.messageHandlers.ipc.postMessage(m)}catch(e){}};
const open=url=>send({t:'home_open',url});window.__rakSetHomeBackground=url=>document.documentElement.style.setProperty('--rak-home-image',url||'none');document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>open(b.dataset.url));document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>send({t:'home_command',command:b.dataset.command}));document.getElementById('search').onsubmit=e=>{e.preventDefault();const q=document.getElementById('query').value.trim();if(q)open(q)};
window.setData=d=>{const root=document.getElementById('recent');root.replaceChildren();const items=Array.isArray(d?.recent)?d.recent:[];if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Noch keine besuchten Seiten.';root.appendChild(empty)}else items.forEach(x=>{const b=document.createElement('button');b.className='recent-item';b.dataset.url=x.url||'';b.title=x.url||'';const dot=document.createElement('span');dot.className='recent-dot';dot.textContent='↗';const copy=document.createElement('span');copy.className='recent-copy';const title=document.createElement('span');title.className='recent-title';title.textContent=x.title||x.url||'Unbenannte Seite';const url=document.createElement('span');url.className='recent-url';url.textContent=x.url||'';copy.append(title,url);b.append(dot,copy);b.onclick=()=>open(x.url);root.appendChild(b)});if(d?.version)document.getElementById('status').textContent='RAK '+d.version+' · Tab Islands aktiv · F11 Vollbild · Deine Daten bleiben auf deinem Gerät'};
document.getElementById('query').focus();
