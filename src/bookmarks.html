<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lesezeichen</title>
<style>
/* RAK-DESIGN:BEGIN – generiert aus design/rak-design.css (tools/apply-design.py), nicht von Hand ändern */
/* ====== RAK Design System · Tactical Cyberpunk Precision (Quelle: DESIGN.md aus Google Stitch) ======
   Nur natives CSS. Keine externen Schriften/Frameworks: Schriften werden über lokale Namen gesucht,
   sonst greifen die Windows-Systemschriften. Alle Komponenten benutzen die Variablen
   --bg --panel --panel2 --line --accent --on-accent --text --dim (+ --hover-line), damit das
   Light/Dark-Umschalten von RAK (rakApplyDesign) und die eigenen Farben weiter funktionieren. */
:root{
  color-scheme:dark;
  /* Palette (DESIGN.md → Colors) */
  --canvas:#0b0d11; --surface-1:#12151b; --surface-2:#1a1f28; --border:#252c38;
  --cyan:#00d2ff; --cyan-hover:#38bdf8; --sky:#0ea5e9;
  --text-hi:#f1f5f9; --text-mid:#94a3b8; --text-lo:#475569; --crimson:#f43f5e;
  /* Semantische Namen, die RAK schon kennt (werden vom Theme überschrieben) */
  --bg:var(--canvas); --panel:var(--surface-1); --panel2:var(--surface-2); --line:var(--border);
  --accent:var(--cyan); --on-accent:#0b0d11; --text:var(--text-hi); --dim:var(--text-mid);
  --hover-line:var(--sky); --danger:var(--crimson); --ok:#3ddc84; --warn:#ffd24a;
  /* Typografie */
  --font-display:"Space Grotesk","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --font-ui:"Geist","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  /* Form & Tiefe */
  --r-xs:2px; --r-sm:4px; --r-md:6px;
  --recess:color-mix(in srgb,var(--bg) 70%,var(--panel));
  --edge:inset 0 1px 0 color-mix(in srgb,var(--text) 5%,transparent);
  --glow:0 0 0 1px var(--accent),0 0 12px color-mix(in srgb,var(--accent) 18%,transparent);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body.rak-ds{background:var(--bg);color:var(--text);font:13px/18px var(--font-ui);-webkit-font-smoothing:antialiased;animation:rak-fade .22s var(--ease) both}
:where(.rak-ds) ::selection{background:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--text)}
:where(.rak-ds) h1,:where(.rak-ds) h2,:where(.rak-ds) h3{font-family:var(--font-display);letter-spacing:-.02em;margin:0}
:where(.rak-ds) code,:where(.rak-ds) kbd,:where(.rak-ds) .mono{font-family:var(--font-mono)}
:where(.rak-ds) :focus-visible{outline:0;box-shadow:var(--glow)}
:where(.rak-ds) button,:where(.rak-ds) select,:where(.rak-ds) input{font-family:inherit;font-size:inherit}
:where(.rak-ds) button{cursor:pointer}
:where(.rak-ds) button:disabled{opacity:.45;cursor:default}
/* Dünne, dunkle Scrollbalken */
.rak-ds{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
:where(.rak-ds) ::-webkit-scrollbar{width:8px;height:8px}
:where(.rak-ds) ::-webkit-scrollbar-thumb{background:var(--line);border-radius:var(--r-sm)}
:where(.rak-ds) ::-webkit-scrollbar-thumb:hover{background:var(--hover-line)}
/* Icons: inline SVG-Sprite, Größe über --s */
.ds-i{width:var(--s,16px);height:var(--s,16px);flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
/* Beschriftungen in Mono (Telemetrie-Look) */
.eyebrow,.tag{font-family:var(--font-mono);font-size:10px;line-height:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.eyebrow{color:var(--accent)}
/* Buttons */
.ds-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:32px;padding:6px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel2);color:var(--text);font-weight:500;box-shadow:var(--edge);transition:border-color .15s var(--ease),color .15s var(--ease),background .15s var(--ease),transform .08s}
.ds-btn:hover:not(:disabled){border-color:var(--accent);color:var(--text)}
.ds-btn:active:not(:disabled){transform:scale(.98)}
.ds-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.ds-btn.primary:hover:not(:disabled){background:var(--cyan-hover);border-color:var(--cyan-hover)}
.ds-btn.danger{color:var(--danger);background:transparent;border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.ds-btn.danger:hover:not(:disabled){background:var(--danger);border-color:var(--danger);color:#fff}
.ds-btn.mini{min-height:26px;padding:3px 10px;font-size:12px}
.ds-icon-btn{display:inline-grid;place-items:center;width:28px;height:28px;padding:0;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--dim);transition:all .15s var(--ease)}
.ds-icon-btn:hover:not(:disabled){background:var(--panel2);border-color:var(--line);color:var(--text)}
/* Eingabefelder */
.ds-field,:where(.rak-ds) input[type=text],:where(.rak-ds) input:not([type]),:where(.rak-ds) input[type=search],:where(.rak-ds) input[type=password]{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--recess);color:var(--text);outline:0;transition:border-color .15s,box-shadow .15s}
.ds-field:focus,:where(.rak-ds) input[type=text]:focus,:where(.rak-ds) input:not([type]):focus,:where(.rak-ds) input[type=search]:focus,:where(.rak-ds) input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 20%,transparent)}
:where(.rak-ds) input::placeholder{color:var(--text-lo)}
/* Auswahlfelder mit eingebettetem Pfeil (ohne Bild-URL) */
:where(.rak-ds) select{appearance:none;-webkit-appearance:none;height:32px;padding:0 30px 0 11px;border:1px solid var(--line);border-radius:var(--r-sm);background-color:var(--panel2);color:var(--text);outline:0;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-size:5px 5px,5px 5px;background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-repeat:no-repeat;transition:border-color .15s}
:where(.rak-ds) select:hover:not(:disabled),:where(.rak-ds) select:focus{border-color:var(--accent)}
:where(.rak-ds) select:disabled{opacity:.45;cursor:default}
:where(.rak-ds) select option{background:var(--panel);color:var(--text)}
/* Schalter (Toggle 36×18) und Checkboxen: gleiches <input type=checkbox>, nur anderes Aussehen */
:where(.rak-ds) input[type=checkbox]{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:36px;height:18px;margin:0;border:1px solid var(--line);border-radius:9px;background:var(--panel2);cursor:pointer;transition:background .14s var(--ease),border-color .14s var(--ease)}
:where(.rak-ds) input[type=checkbox]::after{content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:transform .14s var(--ease),background .14s var(--ease)}
:where(.rak-ds) input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
:where(.rak-ds) input[type=checkbox]:checked::after{transform:translateX(18px);background:#fff}
:where(.rak-ds) input[type=checkbox]:disabled{opacity:.45;cursor:default}
/* Module (Karten) */
.ds-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--edge)}
/* Tastenkürzel-Chips */
:where(.rak-ds) kbd{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:var(--r-xs);background:var(--panel2);color:var(--dim);font-size:10px;line-height:14px}
@keyframes rak-fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes rak-pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){body.rak-ds{animation:none}:where(.rak-ds) *{transition:none!important;animation:none!important}}

/* RAK-DESIGN:END */
body{min-height:100vh;padding:28px 0 64px}
.wrap{max-width:860px;margin:0 auto;padding:0 24px}
.mark{display:grid;place-items:center;flex:none;width:36px;height:36px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel2);color:var(--accent);box-shadow:var(--edge)}
h1{font-size:28px;line-height:36px;font-weight:600}
.sub{margin:0 0 20px 50px;color:var(--dim);font-size:13px;line-height:1.5}
/* Das ×-Zeichen aus dem Skript wird ausgeblendet und als Kreuz gezeichnet */
.x{position:relative;display:inline-block;font-size:0!important;line-height:0}
.x:before,.x:after{content:"";position:absolute;left:50%;top:50%;width:12px;height:1.7px;margin:-.85px 0 0 -6px;background:currentColor;border-radius:1px}
.x:before{transform:rotate(45deg)}.x:after{transform:rotate(-45deg)}
.page-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.add{display:flex;gap:10px;margin-bottom:22px}
.add input{flex:1}
button{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:13px;font-weight:500;transition:background .15s,color .15s,border-color .15s,transform .08s}
button:active{transform:scale(.98)}
.ok{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}.ok:hover{background:var(--cyan-hover);border-color:var(--cyan-hover)}
.ghost{background:var(--panel2);color:var(--dim)}.ghost:hover{color:var(--text);border-color:var(--accent)}
.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.group{margin-bottom:14px;padding:6px 6px 8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--edge);animation:rak-fade .22s var(--ease) both}
.ghead{display:flex;align-items:center;gap:10px;padding:8px 10px 6px}
.ghead .ico{display:flex;color:var(--accent)}
.ghead input{flex:1;height:30px;padding:0 8px;border-color:transparent;background:transparent;font-family:var(--font-display);font-size:15px;font-weight:600}
.ghead input:hover,.ghead input:focus{border-color:var(--line);background:var(--recess)}
.row{display:flex;align-items:center;gap:12px;padding:7px 10px;border:1px solid transparent;border-radius:var(--r-sm);cursor:pointer;transition:background .12s,border-color .12s}
.row:hover{background:var(--panel2);border-color:var(--line)}
.main{flex:1;min-width:0}
.t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u{margin-top:1px;color:var(--dim);font-family:var(--font-mono);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row select{height:28px;max-width:180px;font-size:12px}
.x{width:28px;height:28px;padding:0;border:0;border-radius:var(--r-sm);background:transparent;color:var(--dim)}
.x:hover{background:var(--accent);color:var(--on-accent)}
.none{padding:8px 12px;color:var(--dim);font-size:13px}
</style>
</head>
<body class="rak-ds"><!--RAK-SPRITE:BEGIN--><svg class="sprite" aria-hidden="true" focusable="false"><defs><symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 011 1v15l-6-4-6 4V5a1 1 0 011-1z"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol></defs></svg><!--RAK-SPRITE:END-->
<div class="wrap">
  <div class="page-head"><span class="mark"><svg class="ds-i" style="--s:20px" aria-hidden="true"><use href="#i-bookmark"/></svg></span><h1>Lesezeichen</h1></div>
  <div class="sub">Ordner anlegen, umbenennen und Lesezeichen verschieben. Gelöschte Ordner geben ihre Lesezeichen an die Leiste zurück.</div>
  <div class="add">
    <input id="newFolder" placeholder="Neuer Ordner …" spellcheck="false">
    <button class="ok" id="addFolder"><svg class="ds-i" aria-hidden="true"><use href="#i-plus"/></svg>Ordner anlegen</button>
  </div>
  <div id="groups"></div>
</div>
<script>
  const send = (o) => {
    const m = JSON.stringify(o);
    try {
      if (window.ipc && window.ipc.postMessage) return window.ipc.postMessage(m);
      if (window.chrome && window.chrome.webview) return window.chrome.webview.postMessage(m);
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ipc)
        return window.webkit.messageHandlers.ipc.postMessage(m);
    } catch (e) { console.error(e); }
  };
  let data = __DATA__;
  const root = document.getElementById("groups");
  const FOLDER = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3.5 6.5h6l2 2.5h9v9.5h-17z"/></svg>';
  const BAR = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 17l-5.4 3 1.2-6L3.3 9.8l6.1-.7z"/></svg>';

  function bookmarkRow(b, folders) {
    const row = document.createElement("div"); row.className = "row";
    const main = document.createElement("div"); main.className = "main";
    const t = document.createElement("div"); t.className = "t"; t.textContent = b.title;
    const u = document.createElement("div"); u.className = "u"; u.textContent = b.url;
    main.append(t, u);
    const sel = document.createElement("select"); sel.title = "In Ordner verschieben";
    const o0 = document.createElement("option"); o0.value = ""; o0.textContent = "Lesezeichenleiste"; sel.appendChild(o0);
    folders.forEach(f => { const o = document.createElement("option"); o.value = f.id; o.textContent = f.name; sel.appendChild(o); });
    sel.value = b.folder == null ? "" : String(b.folder);
    sel.onclick = (e) => e.stopPropagation();
    sel.onchange = () => send({ t: "bm_move", id: b.id, folder: sel.value === "" ? null : Number(sel.value) });
    const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.title = "Lesezeichen löschen";
    x.onclick = (e) => { e.stopPropagation(); send({ t: "bm_del", id: b.id }); };
    row.onclick = () => send({ t: "open", url: b.url });
    row.append(main, sel, x);
    return row;
  }

  function group(title, iconHtml, items, folders, folder) {
    const g = document.createElement("div"); g.className = "group";
    const head = document.createElement("div"); head.className = "ghead";
    const ico = document.createElement("span"); ico.className = "ico"; ico.innerHTML = iconHtml;
    head.appendChild(ico);
    if (folder) {
      const name = document.createElement("input"); name.value = folder.name; name.title = "Zum Umbenennen klicken";
      const commit = () => { if (name.value.trim() && name.value !== folder.name) send({ t: "folder_ren", id: folder.id, name: name.value }); };
      name.addEventListener("keydown", (e) => { if (e.key === "Enter") { commit(); name.blur(); } });
      name.addEventListener("blur", commit);
      const del = document.createElement("button"); del.className = "danger"; del.textContent = "Ordner löschen";
      del.onclick = () => send({ t: "folder_del", id: folder.id });
      head.append(name, del);
    } else {
      const h = document.createElement("div"); h.style.cssText = "flex:1;font-size:15px;font-weight:600;padding:0 8px"; h.textContent = title;
      head.appendChild(h);
    }
    g.appendChild(head);
    if (!items.length) { const n = document.createElement("div"); n.className = "none"; n.textContent = "Keine Lesezeichen."; g.appendChild(n); }
    items.forEach(b => g.appendChild(bookmarkRow(b, folders)));
    return g;
  }

  function render() {
    root.innerHTML = "";
    const { bookmarks, folders } = data;
    root.appendChild(group("Lesezeichenleiste", BAR, bookmarks.filter(b => b.folder == null), folders, null));
    folders.forEach(f => root.appendChild(group(f.name, FOLDER, bookmarks.filter(b => b.folder === f.id), folders, f)));
  }

  const nf = document.getElementById("newFolder");
  const addFolder = () => { if (nf.value.trim()) { send({ t: "folder_add", name: nf.value }); nf.value = ""; } };
  document.getElementById("addFolder").onclick = addFolder;
  nf.addEventListener("keydown", (e) => { if (e.key === "Enter") addFolder(); });

  window.setData = (d) => { data = d; render(); };
  render();
</script>
</body>
</html>
